<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>minio, s.r.o. - Consulting, custom development, training</title>
    <meta name="description" content="minio - consulting, custom development, training">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter/static/Inter_18pt-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Inter';
            src: url('fonts/Inter/static/Inter_18pt-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            font-size: 21px;
            line-height: 1.5;
            color: #0b0c0c;
            background: #ffffff;
        }

        .measure {
            max-width: 42rem;
            padding: 2rem 1.5rem;
        }

        header {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.1;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 3rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #b1b4b6;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 1.5rem 0 0.5rem 0;
        }

        p {
            margin: 0 0 1.25rem 0;
        }

        ul {
            margin: 0 0 1.25rem 0;
            padding-left: 1.5rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        a {
            color: #005ea5;
            text-decoration: underline;
        }

        a:hover {
            color: #003078;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.125rem 0.5rem;
            margin-left: 0.75rem;
            background: #f3f2f1;
            color: #505050;
            text-decoration: none;
            vertical-align: middle;
        }

        address {
            font-style: normal;
            line-height: 1.6;
        }

        .contact-grid {
            display: grid;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .contact-label {
            font-weight: 400;
            color: #505050;
        }

        footer {
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 2px solid #0b0c0c;
            font-size: 0.875rem;
            color: #505050;
        }

        @media (min-width: 640px) {
            .measure {
                padding: 3rem 2rem;
            }

            h1 {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="measure">
        <header>
            <h1>minio</h1>
            <p></p>
        </header>

        <main>
            <section>
                <h2>Services</h2>
                <ul>
                    <li>Software Development / IT Consulting / Training</li>
                    <li>Education for Children</li>
                </ul>
            </section>


            <section>
                <h2>Contact</h2>
                <p><a href="mailto:hello@minio.sk">hello@minio.sk</a></p>
                
                <address>
                    <div class="contact-grid">
                        <address>
                            minio, s.r.o.<br>
                            Púpavová 691/31<br>
                            841 04 Bratislava
                        </address>
                        <div>
                            <span class="contact-label">Company ID/IČO:</span> 46058397<br>
                            <span class="contact-label">TIN/DIČ:</span> 2023207296
                        </div>
                    </div>
                </address>
            </section>
        </main>
    </div>
</body>
</html>
